services:
  austerweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: austerweb-landing
    ports:
      - "3000:3000"
    volumes:
      # Montar archivos para hot reload
      - ./index.html:/app/index.html:ro
      - ./sistema-notarial.html:/app/sistema-notarial.html:ro
      - ./gestor-departamentos.html:/app/gestor-departamentos.html:ro
      - ./agenda-odontologica.html:/app/agenda-odontologica.html:ro
      - ./gv-austral.html:/app/gv-austral.html:ro
      - ./679inn.html:/app/679inn.html:ro
      - ./nutrainer.html:/app/nutrainer.html:ro
      - ./proyectar-ideas.html:/app/proyectar-ideas.html:ro
      - ./favicon.svg:/app/favicon.svg:ro
      - ./favicon-simple.svg:/app/favicon-simple.svg:ro
      - ./styles.css:/app/styles.css:ro
      - ./trabajos.css:/app/trabajos.css:ro
      - ./script.js:/app/script.js:ro
      - ./portfolio.js:/app/portfolio.js:ro
      - ./LogosProyectos:/app/LogosProyectos:ro
      - ./LogosProyectos/Sistema-Notarial:/app/LogosProyectos/Sistema-Notarial:ro
      - ./LogosProyectos/Gestor-de-Reservas:/app/LogosProyectos/Gestor-de-Reservas:ro
      - ./LogosProyectos/Agenda-Odontologica:/app/LogosProyectos/Agenda-Odontologica:ro
    environment:
      - NODE_ENV=development
      - HOT_RELOAD=true
    restart: unless-stopped
    networks:
      - austerweb-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.austerweb.rule=Host(`localhost`)"
      - "traefik.http.services.austerweb.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  austerweb-network:
    driver: bridge
    name: austerweb-network
